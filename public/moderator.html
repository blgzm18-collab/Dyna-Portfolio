<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dynamexed Moderator Dashboard</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: #fff;
    }

    header {
      background: #181818;
      padding: 20px;
      text-align: center;
      border-bottom: 2px solid #333;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: 1px;
    }

    .container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 20px;
    }

    .card {
      background: #1c1c1c;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 25px;
      border: 1px solid #333;
    }

    .card h2 {
      margin-top: 0;
      font-size: 22px;
      border-bottom: 1px solid #333;
      padding-bottom: 10px;
    }

    .btn {
      display: inline-block;
      padding: 10px 16px;
      background: #007bff;
      color: #fff;
      border-radius: 6px;
      text-decoration: none;
      margin-top: 10px;
      transition: 0.2s;
    }

    .btn:hover {
      background: #005fcc;
    }

    textarea {
      width: 100%;
      height: 200px;
      background: #111;
      color: #fff;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 10px;
      font-size: 14px;
    }

    .save-btn {
      background: #28a745;
    }

    .save-btn:hover {
      background: #1e7e34;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #777;
      margin-top: 40px;
    }
  </style>
</head>

<body>
  <header>
    <h1>DynaMexed Moderator Dashboard</h1>
  </header>

  <div class="container">

    <!-- User Info -->
    <div class="card">
      <h2>Logged-in User</h2>
      <p id="user-info">Loading user data...</p>
    </div>

    <!-- JSON Editor -->
    <div class="card">
      <h2>Site Content Editor</h2>
      <p>Edit your site’s JSON content below:</p>
      <textarea id="json-editor"></textarea>
      <br />
      <a class="btn save-btn" onclick="saveJSON()">Save Changes</a>
    </div>

    <!-- Tools -->
    <div class="card">
      <h2>Moderator Tools</h2>
      <a class="btn" href="/">Return to Homepage</a>
      <a class="btn" href="/logout">Logout</a>
    </div>

  </div>

  <footer>
    DynaMexed © 2026 — Moderator Panel
  </footer>

  <script>
    // Load user cookie
    function getCookie(name) {
      const value = `; ${document.cookie}`;
      const parts = value.split(`; ${name}=`);
      if (parts.length === 2) return decodeURIComponent(parts.pop().split(";").shift());
    }

    // Display user info
    const userData = getCookie("user");
    if (userData) {
      const user = JSON.parse(userData);
      document.getElementById("user-info").innerHTML =
        `<strong>${user.username}</strong> (ID: ${user.id})`;
    } else {
      document.getElementById("user-info").innerHTML =
        "No user data found — you may not be logged in.";
    }

    // Load JSON file
    fetch("/content.json")
      .then(res => res.json())
      .then(data => {
        document.getElementById("json-editor").value = JSON.stringify(data, null, 2);
      });

    // Save JSON (requires your API route)
    function saveJSON() {
      const newData = document.getElementById("json-editor").value;

      fetch("/api/save-json", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: newData
      })
        .then(res => res.json())
        .then(result => {
          alert("JSON saved successfully!");
        })
        .catch(err => {
          alert("Error saving JSON.");
          console.error(err);
        });
    }
  </script>
</body>
</html>
