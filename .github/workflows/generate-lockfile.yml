name: Generate package-lock

on:
  push:
    paths:
      - 'package.json'
      - '.github/workflows/generate-lockfile.yml'

jobs:
  install-and-commit-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies (generate package-lock.json)
        run: npm install

      - name: Commit package-lock.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: add package-lock.json (generated by workflow)" || echo "no changes to commit"
          git push
